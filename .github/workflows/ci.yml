name: chatre-api-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: node --check api/agent.js api/companion.js lib/agent.js lib/companion.js lib/budgets.js lib/desktop-client.js lib/browser-client.js
      - run: node -e "require('./lib/budgets'); require('./lib/allowlists'); console.log('ok')"
